name: Publish Credo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack the newest site-*.zip
        run: |
          ZIP="$(ls site-*.zip | LC_ALL=C sort | tail -n 1)"
          echo "Publishing $ZIP"
          mkdir _site
          unzip -q "$ZIP" -d _site
          echo "Files: $(find _site -type f | wc -l)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
